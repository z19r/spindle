# Ground truth for tests/eval_grouping.rs. `group` is the expected
# folder; the scorer only checks that files sharing a group land
# together and that the first label segment matches `area` (or one
# of `alt_areas` when a reasonable organizer could file it elsewhere).
#
# Every folder here holds at least MIN_GROUP_SIZE files, which is the
# smallest the validator will leave standing. An answer key built from
# pairs asks for folders no run can produce, and it also pins the
# granularity score near zero, so the fixture cannot tell a run that
# shreds a topic into pairs from one that does not — the very mistake
# that metric exists to catch. Keep it that way when adding files: a
# new folder needs four members or it belongs in an existing one.


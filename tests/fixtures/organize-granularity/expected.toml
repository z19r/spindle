# Ground truth for tests/eval_grouping.rs.
#
# Every cluster here is one thing whose members are individually
# distinguishable: one renovation across four trades, one job search
# across three companies, one trip across two cities, one injury
# across four providers. Splitting any of them along that inner seam
# produces folders that are each defensible and a tree that is wrong.
# That is the failure this fixture exists to score, so no expected
# group holds fewer than MIN_GROUP_SIZE files and a perfect run
# scores 1.000 on granularity.


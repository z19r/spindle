[package]
name = "spindle"
version = "0.1.3"
edition = "2021"
description = "AI-powered file organizer that uses content analysis to intelligently group and sort files"
license = "MIT"
repository = "https://github.com/z19r/spindle"
homepage = "https://github.com/z19r/spindle"
readme = "README.md"
keywords = ["file-organizer", "ai", "content-analysis", "deduplication", "tui"]
categories = ["command-line-utilities", "filesystem"]
authors = ["Zack Kitzmiller"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (for Claude API)
# rustls-tls instead of default native-tls so cross-compiling (e.g.
# aarch64 in the release workflow) needs no system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "multipart",
  "rustls-tls",
  "charset",
  "http2",
  "system-proxy",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# File hashing
blake3 = { version = "1", features = ["rayon"] }
rayon = "1"

# Perceptual image hashing
image_hasher = "2"
image = "0.25"

# EXIF metadata
kamadak-exif = "0.6"

# Directory walking
walkdir = "2"

# TUI
ratatui = "0.29"
ratatui-image = { version = "7.0", features = ["crossterm"] }
crossterm = "0.28"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
futures = "0.3"

# Text diffing
similar = "2"

# File type detection (magic bytes)
infer = "0.22"

# Misc
directories = "5"
base64 = "0.23"
hex = "0.4"
dotenvy = "0.15"
pdf-extract = "0.10.0"
zip = "8"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio-test = "0.4"
assert_fs = "1"


[features]
default = []
video = []  # Future: rsmpeg for video keyframe extraction

[profile.release]
lto = true
codegen-units = 1
strip = true

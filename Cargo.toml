[package]
name = "spindle"
version = "0.1.3"
edition = "2021"
description = "AI-powered file organizer that uses content analysis to intelligently group and sort files"
license = "MIT"
repository = "https://github.com/z19r/spindle"
homepage = "https://github.com/z19r/spindle"
readme = "README.md"
keywords = ["file-organizer", "ai", "content-analysis", "deduplication", "tui"]
categories = ["command-line-utilities", "filesystem"]
authors = ["Zack Kitzmiller"]


# TUI
ratatui = "0.30"
ratatui-image = { version = "11.0", default-features = false, features = ["crossterm"] }
crossterm = "0.29"

# Image processing
image = "0.25"ratatui-image = { version = "11.0", default-features = false, features = ["crossterm"] }
crossterm = "0.28"

# Image processing
image = "0.25"

# Time
chrono = { version = "0.4", features = ["clock"] }

# EXIF metadata
kamadak-exif = "0.6"

# Directory walking
walkdir = "2"

# Error handling
anyhow = "1"
dotenvy = "0.15"
pdf-extract = "0.10.0"
zip = "8"
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"

# Async utilities
futures = "0.3"

# Text diffing
similar = "2"

# File type detection (magic bytes)
infer = "0.22"

# Misc
directories = "6"
base64 = "0.23"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio-test = "0.4"
assert_fs = "1"


[features]
default = []
video = []  # Future: rsmpeg for video keyframe extraction
[profile.release]
lto = true
codegen-units = 1
strip = true

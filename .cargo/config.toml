[build]
# Set the target directory
target-dir = "target"

[profile.dev]
# Development profile settings
opt-level = 0debug = true
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1

[profile.test]
# Test profile settings
opt-level = 0
debug = true

[profile.bench]
# Benchmark profile settings
opt-level = 3
debug = false
lto = true
codegen-units = 1
